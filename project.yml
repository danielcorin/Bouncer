name: Bouncer

# XcodeGen spec. This YAML is the source of truth for the Xcode project;
# the generated .xcodeproj is disposable (git-ignored). Regenerate with:
#   mise exec -- xcodegen generate

options:
  postGenCommand: scripts/prepare-xcode.sh Bouncer.xcodeproj
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Project-level signing config lives in an xcconfig so a real Team ID and
# bundle id can stay in the git-ignored Configuration/Local.xcconfig.
configFiles:
  Debug: Configuration/Shared.xcconfig
  Release: Configuration/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_CODE_COVERAGE: "NO"
    CLANG_COVERAGE_MAPPING: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: "YES"      # required for notarization
    GENERATE_INFOPLIST_FILE: "YES"
    DEAD_CODE_STRIPPING: "YES"
    # The app embeds the companion CLI after it is built. Xcode's user-script
    # sandbox blocks ditto's temporary staging file on incremental builds.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Release:
      # Installed apps and helpers must not contain LLVM profile writers.
      ENABLE_CODE_COVERAGE: "NO"
      CLANG_COVERAGE_MAPPING: "NO"

packages:
  AppAutomation:
    path: Packages/AppAutomation
  TOML:
    url: https://github.com/mattt/swift-toml.git
    exactVersion: 2.0.0

targets:
  BouncerCore:
    type: library.static
    preBuildScripts:
      - name: Check generated API
        script: |
          "${SRCROOT}/scripts/check-generated.sh" --quick
          python3 "${SRCROOT}/scripts/check-ui-boundary.py"
        basedOnDependencyAnalysis: false
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Shared
      - Sources/Filter
    settings:
      base:
        PRODUCT_NAME: BouncerCore
        DEFINES_MODULE: YES
    dependencies:
      - package: AppAutomation
        product: AutomationRuntime
        link: false
      - package: TOML
        # Static-library targets do not link package products by default in
        # XcodeGen; Core imports TOML, so make this dependency explicit.
        link: true

  Bouncer:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: BouncerCore
      - package: AppAutomation
        product: AutomationRuntime
      - target: BouncerCLI
        embed: false
      - target: BouncerTunnel
        embed: true
      - sdk: Carbon.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: Bouncer
        COMBINE_HIDPI_IMAGES: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"          # menu bar app: no Dock icon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    postBuildScripts:
      - name: Embed Bouncer CLI
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          ditto "${BUILT_PRODUCTS_DIR}/bouncer" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/bouncer"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/bouncer"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/bouncer"
    entitlements:
      path: App.entitlements
      properties:
        # The companion CLI and app communicate through a user-only Unix socket
        # in ~/Library/Application Support. Use App Group/XPC IPC before enabling
        # App Sandbox for a future Mac App Store build.
        com.apple.security.app-sandbox: false
        # Bouncer blocks through its own DNS-only packet tunnel (Sources/Tunnel).
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]

  BouncerCLI:
    type: tool
    platform: macOS
    sources:
      - Sources/CLI
    dependencies:
      - package: AppAutomation
        product: AutomationCLI
      - target: BouncerCore
      - package: AppAutomation
        product: AutomationRuntime
    settings:
      base:
        PRODUCT_NAME: bouncer
        PRODUCT_MODULE_NAME: BouncerCommand
        # The executable ships inside the app. Installing a second archive
        # product beside the app would create a generic, non-exportable archive.
        SKIP_INSTALL: "YES"

  # Network Extension packet tunnel that claims only DNS: it becomes the system
  # resolver while blocking is on. Compiled from Sources/Tunnel + Sources/Filter.
  BouncerTunnel:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Tunnel
      - Sources/Filter
    dependencies:
      - sdk: NetworkExtension.framework
    info:
      path: Sources/Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Bouncer DNS Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_NAME: BouncerTunnel
        PRODUCT_BUNDLE_IDENTIFIER: llc.wvlen.Bouncer.Tunnel
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: Sources/Tunnel/Tunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]

  BouncerAutomationFixture:
    type: tool
    platform: macOS
    sources:
      - TestsSupport
    dependencies:
      - target: BouncerCore
      - package: AppAutomation
        product: AutomationRuntime
    settings:
      base:
        SKIP_INSTALL: "YES"

  BouncerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - TestsSupport/ScenarioSuite.swift
      - TestsSupport/InMemoryFilterBackend.swift
    dependencies:
      - target: BouncerCore
      - package: AppAutomation
        product: AutomationRuntime

schemes:
  BouncerAutomationFixture:
    build:
      targets:
        BouncerAutomationFixture: all

  Bouncer:
    build:
      targets:
        Bouncer: all
        BouncerCLI: all
        BouncerTunnel: all
        BouncerCore: all
        BouncerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Opt in only for isolated test builds with -enableCodeCoverage YES.
      gatherCoverageData: false
      targets:
        - BouncerTests
    archive:
      config: Release

  BouncerCLI:
    build:
      targets:
        BouncerCLI: all
        BouncerCore: all
    run:
      config: Debug
    archive:
      config: Release
