name: BouncerTunnelPOC

# Proof of concept: can a Network Extension packet tunnel that only handles DNS
# make Bouncer's blocks apply even when iCloud Private Relay is on?
# Build: scripts/run.sh build   (see README.md)

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 93W5N4LQL7
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: "YES"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BouncerTunnelPOC:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - target: BouncerTunnel
        embed: true
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.wvlen.Bouncer.TunnelPOC
        INFOPLIST_KEY_LSUIElement: "YES"
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]

  BouncerTunnel:
    type: app-extension
    platform: macOS
    sources:
      - Tunnel
      - path: ../../Sources/Filter
        group: Filter
    dependencies:
      - sdk: NetworkExtension.framework
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: BouncerTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.wvlen.Bouncer.TunnelPOC.Tunnel
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
